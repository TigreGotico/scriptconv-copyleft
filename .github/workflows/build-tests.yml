name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      install_extras: 'test'
      system_deps: 'espeak-ng'
      test_path: 'tests'
      # transphone and spaCy print their model downloads to stdout on first use,
      # which the docs examples test reads as output. One run downloads them.
      pre_test_command: 'python -m doctest docs/backends.md > /dev/null || true'
